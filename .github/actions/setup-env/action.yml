name: 'Set up Environment'
description: 'Sets up PNPM, Node.js with caching, and optionally installs dependencies.'

inputs:
  node-version:
    description: 'Node.js version to set up'
    required: false
    default: '24'
  pnpm-version:
    description: 'Optional PNPM version override (defaults to packageManager in package.json)'
    required: false
    default: ''
  install-deps:
    description: 'Whether to run pnpm install'
    required: false
    default: 'true'
  frozen-lockfile:
    description: 'Whether to use --frozen-lockfile or --no-frozen-lockfile'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up PNPM (from packageManager field)
      if: ${{ inputs.pnpm-version == '' }}
      uses: pnpm/action-setup@v6

    - name: Set up PNPM (explicit version override)
      if: ${{ inputs.pnpm-version != '' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies (frozen-lockfile)
      if: ${{ inputs.install-deps == 'true' && inputs.frozen-lockfile == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install dependencies (no-frozen-lockfile)
      if: ${{ inputs.install-deps == 'true' && inputs.frozen-lockfile != 'true' }}
      shell: bash
      run: pnpm install --no-frozen-lockfile --prefer-offline
