# ==============================================================================
# REQUIRED SETUP (one-time, in GitHub repo Settings):
#
# 1. Secrets (Settings > Secrets and variables > Actions):
#    - VERCEL_API_TOKEN        A Vercel personal/team API token with write
#                              access. Create at https://vercel.com/account/tokens.
#                              NOTE: this token is account/team-scoped, not
#                              limited to this one Global Config store - keep
#                              it out of logs and rotate it periodically.
#    - VERCEL_GLOBAL_CONFIG_ID The target store's ID (starts with `ecfg_`).
#                              Find it on the Global Config's detail page in
#                              the Vercel dashboard.
#    - VERCEL_ORG_ID           Reuses the same secret deploy-prod.yml/
#                              deploy-dev.yml already use. For a team-owned
#                              project this is the same value as the Team ID
#                              (Team Settings > General) - no separate secret
#                              needed.
#
# 2. (Recommended) Settings > Environments > create an environment named
#    "maintenance-mode" and add required reviewers, so flipping maintenance
#    mode on production needs a second person's approval before it runs.
#    Without this, anyone with write access to the repo can trigger it
#    unattended.
# ==============================================================================

name: Toggle Maintenance Mode

on:
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: '維護模式(直接封站,所有流量導向 /maintenance)'
        type: choice
        required: true
        options:
          - 不變更
          - 開啟
          - 關閉
        default: 不變更
      confirm_maintenance_on:
        description: '我了解這會讓整個網站無法使用(選「開啟」維護模式前必須勾選)'
        type: boolean
        required: false
        default: false
      announcement_enabled:
        description: '公告 banner(只是提醒用的橫幅,不會封站)'
        type: choice
        required: true
        options:
          - 不變更
          - 開啟
          - 關閉
        default: 不變更
      announcement_message:
        description: '公告文字(留空 = 保留目前的訊息)'
        type: string
        required: false
      announcement_time:
        description: '維護時間(從現在開始算;選「清空」會移除倒數時間)'
        type: choice
        required: true
        options:
          - 不變更
          - 30分鐘後
          - 1小時後
          - 2小時後
          - 3小時後
          - 6小時後
          - 12小時後
          - 24小時後
          - 清空
        default: 不變更

permissions:
  contents: read

jobs:
  update-global-config:
    runs-on: ubuntu-latest
    name: Update Global Config
    environment: maintenance-mode
    env:
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      GLOBAL_CONFIG_ID: ${{ secrets.VERCEL_GLOBAL_CONFIG_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
      MAINTENANCE_MODE: ${{ inputs.maintenance_mode }}
      CONFIRM_MAINTENANCE_ON: ${{ inputs.confirm_maintenance_on }}
      ANNOUNCEMENT_ENABLED: ${{ inputs.announcement_enabled }}
      ANNOUNCEMENT_MESSAGE: ${{ inputs.announcement_message }}
      ANNOUNCEMENT_TIME: ${{ inputs.announcement_time }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail

          if [ "$MAINTENANCE_MODE" = "開啟" ] && [ "$CONFIRM_MAINTENANCE_ON" != "true" ]; then
            echo "::error::maintenance_mode 選了「開啟」,但沒有勾選確認選項(confirm_maintenance_on)。請重新執行並勾選確認,避免手殘誤觸封站。"
            exit 1
          fi

          if [ "$MAINTENANCE_MODE" = "不變更" ] && \
             [ "$ANNOUNCEMENT_ENABLED" = "不變更" ] && \
             [ -z "$ANNOUNCEMENT_MESSAGE" ] && \
             [ "$ANNOUNCEMENT_TIME" = "不變更" ]; then
            echo "::error::沒有任何要變更的內容,結束。"
            exit 1
          fi

      - name: Fetch current Global Config items
        run: |
          set -euo pipefail

          # /v1/global-config is correct here, not /v1/edge-config - Vercel's
          # rename docs (vercel.com/docs/global-config/migration-guide) say
          # new integrations should use /v1/global-config; /v1/edge-config
          # only still works for backward compatibility. Store IDs keep the
          # `ecfg_` prefix regardless of which path you call.
          team_query=""
          [ -n "$VERCEL_TEAM_ID" ] && team_query="?teamId=${VERCEL_TEAM_ID}"

          response=$(curl -sS -w '\n%{http_code}' \
            "https://api.vercel.com/v1/global-config/${GLOBAL_CONFIG_ID}/items${team_query}" \
            -H "Authorization: Bearer ${VERCEL_API_TOKEN}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 300 ]; then
            echo "::error::Failed to read current Global Config items (HTTP $http_code)"
            echo "$body"
            exit 1
          fi

          echo "$body" > current.json

      - name: Build items payload
        run: |
          set -euo pipefail

          current_announcement=$(jq -c '.announcement // {"enabled": false, "message": "", "maintenanceTime": ""}' current.json)

          new_enabled=$(echo "$current_announcement" | jq -r '.enabled // false')
          [ "$ANNOUNCEMENT_ENABLED" = "開啟" ] && new_enabled=true
          [ "$ANNOUNCEMENT_ENABLED" = "關閉" ] && new_enabled=false

          new_message=$(echo "$current_announcement" | jq -r '.message // ""')
          [ -n "$ANNOUNCEMENT_MESSAGE" ] && new_message="$ANNOUNCEMENT_MESSAGE"

          # announcement_time is a relative-offset dropdown (no native date
          # picker in workflow_dispatch), so compute the absolute ISO 8601
          # timestamp here rather than asking the operator to type one.
          new_time=$(echo "$current_announcement" | jq -r '.maintenanceTime // ""')
          case "$ANNOUNCEMENT_TIME" in
            不變更) : ;;
            清空) new_time="" ;;
            30分鐘後) new_time=$(TZ='Asia/Taipei' date -d '+30 minutes' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            1小時後) new_time=$(TZ='Asia/Taipei' date -d '+1 hour' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            2小時後) new_time=$(TZ='Asia/Taipei' date -d '+2 hours' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            3小時後) new_time=$(TZ='Asia/Taipei' date -d '+3 hours' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            6小時後) new_time=$(TZ='Asia/Taipei' date -d '+6 hours' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            12小時後) new_time=$(TZ='Asia/Taipei' date -d '+12 hours' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
            24小時後) new_time=$(TZ='Asia/Taipei' date -d '+24 hours' '+%Y-%m-%dT%H:%M:%S+08:00') ;;
          esac

          new_announcement=$(jq -n \
            --argjson enabled "$new_enabled" \
            --arg message "$new_message" \
            --arg time "$new_time" \
            '{enabled: $enabled, message: $message, maintenanceTime: $time}')

          items='[]'

          if [ "$MAINTENANCE_MODE" != "不變更" ]; then
            mode_bool=false
            [ "$MAINTENANCE_MODE" = "開啟" ] && mode_bool=true
            items=$(echo "$items" | jq --argjson v "$mode_bool" '. + [{"operation":"upsert","key":"isInMaintenanceMode","value":$v}]')
          fi

          announcement_changed=false
          if [ "$ANNOUNCEMENT_ENABLED" != "不變更" ] || [ -n "$ANNOUNCEMENT_MESSAGE" ] || [ "$ANNOUNCEMENT_TIME" != "不變更" ]; then
            announcement_changed=true
          fi
          if [ "$announcement_changed" = "true" ]; then
            items=$(echo "$items" | jq --argjson v "$new_announcement" '. + [{"operation":"upsert","key":"announcement","value":$v}]')
          fi

          echo "$items" > items.json
          echo "Pending changes:"
          jq . items.json

      - name: Update Global Config
        run: |
          set -euo pipefail

          payload=$(jq -n --argjson items "$(cat items.json)" '{items: $items}')

          team_query=""
          [ -n "$VERCEL_TEAM_ID" ] && team_query="?teamId=${VERCEL_TEAM_ID}"

          response=$(curl -sS -w '\n%{http_code}' -X PATCH \
            "https://api.vercel.com/v1/global-config/${GLOBAL_CONFIG_ID}/items${team_query}" \
            -H "Authorization: Bearer ${VERCEL_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [ "$http_code" -ge 300 ]; then
            echo "::error::Update failed (HTTP $http_code)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 維護模式 / 公告變更"
            echo ""
            echo "| 欄位 | 值 |"
            echo "|---|---|"
            echo "| maintenance_mode | \`${MAINTENANCE_MODE}\` |"
            echo "| announcement_enabled | \`${ANNOUNCEMENT_ENABLED}\` |"
            echo "| announcement_message | \`${ANNOUNCEMENT_MESSAGE}\` |"
            echo "| announcement_time | \`${ANNOUNCEMENT_TIME}\` |"
            echo "| 觸發者 | \`${GITHUB_ACTOR}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
