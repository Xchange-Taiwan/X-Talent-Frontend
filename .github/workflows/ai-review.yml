name: AI Review Pipeline

on:
  pull_request:
    types: [opened, synchronize]
    branches: ['**']

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GEMINI_MODEL: gemini-4-carbon
  # scripts/ai-review/lib/gemini.mjs defaults to 16384 when unset, which a
  # sufficiently large diff can exceed (the reviewer's JSON response gets cut
  # off mid-object and the job fails with finishReason: MAX_TOKENS instead of
  # posting findings).
  GEMINI_MAX_OUTPUT_TOKENS: '32768'

jobs:
  summary:
    runs-on: ubuntu-latest
    name: 'AI Review: Final Summary'
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout base branch (trusted scripts)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up AI review agent
        uses: ./.github/actions/setup-ai-agent
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          node-version: '24'

      - name: Run unified multimodal AI review pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f scripts/ai-review/run-ci.mjs ]; then
            node scripts/ai-review/run-ci.mjs
          else
            TMP_OUT_DIR="$(mktemp -d)"
            GITHUB_OUTPUT="$TMP_OUT_DIR/planner.out" node scripts/ai-review/planner.mjs || true
            PLAN_B64="$(sed -n 's/^plan=//p' "$TMP_OUT_DIR/planner.out" | tail -n 1)"
            export PLAN_B64

            if [ -n "$PLAN_B64" ]; then
              run_legacy_stage() {
                local script_name="$1"
                local out_file="$TMP_OUT_DIR/${script_name%.mjs}.out"
                GITHUB_OUTPUT="$out_file" node "scripts/ai-review/$script_name"
              }

              run_legacy_stage security.mjs &
              PID_SEC=$!
              run_legacy_stage correctness.mjs &
              PID_COR=$!
              run_legacy_stage business-logic.mjs &
              PID_BIZ=$!
              run_legacy_stage visual-parity.mjs &
              PID_VIS=$!
              wait "$PID_SEC" "$PID_COR" "$PID_BIZ" "$PID_VIS" || true

              run_legacy_stage performance.mjs &
              PID_PERF=$!
              run_legacy_stage testing.mjs &
              PID_TEST=$!
              run_legacy_stage architecture.mjs &
              PID_ARCH=$!
              run_legacy_stage review-guide.mjs &
              PID_GUIDE=$!
              wait "$PID_PERF" "$PID_TEST" "$PID_ARCH" "$PID_GUIDE" || true

              SECURITY_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/security.out" 2>/dev/null | tail -n 1)"
              CORRECTNESS_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/correctness.out" 2>/dev/null | tail -n 1)"
              BUSINESS_LOGIC_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/business-logic.out" 2>/dev/null | tail -n 1)"
              VISUAL_PARITY_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/visual-parity.out" 2>/dev/null | tail -n 1)"
              PERFORMANCE_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/performance.out" 2>/dev/null | tail -n 1)"
              TESTING_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/testing.out" 2>/dev/null | tail -n 1)"
              ARCHITECTURE_FINDINGS_B64="$(sed -n 's/^findings=//p' "$TMP_OUT_DIR/architecture.out" 2>/dev/null | tail -n 1)"
              REVIEW_GUIDE_B64="$(sed -n 's/^guide=//p' "$TMP_OUT_DIR/review-guide.out" 2>/dev/null | tail -n 1)"
              export SECURITY_FINDINGS_B64 CORRECTNESS_FINDINGS_B64 BUSINESS_LOGIC_FINDINGS_B64 VISUAL_PARITY_FINDINGS_B64
              export PERFORMANCE_FINDINGS_B64 TESTING_FINDINGS_B64 ARCHITECTURE_FINDINGS_B64 REVIEW_GUIDE_B64
            fi

            node scripts/ai-review/generate-summary.mjs
            node scripts/ai-review/post-comment.mjs
          fi
