name: Deploy to Vercel (Pull Request Preview)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - '**'
    paths-ignore:
      - 'e2e/**'
      - '.github/**'
      - '.agents/**'
      - '.gemini/**'
      - '.husky/**'
      - '.lavish/**'
      - '.storybook/**'
      - '.vscode/**'
      - 'scripts/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'
      - 'playwright.config.ts'
      - 'vitest.config.mts'
      - 'tsconfig.test.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy-pr-preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Deploy PR Preview to Vercel

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-vercel-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'next.config.js', 'tailwind.config.js', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-vercel-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vercel-nextjs-

      - name: Install Vercel CLI
        run: npm install --global vercel@51.2.1

      - name: Pull Vercel environment (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PREVIEW || secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # Single build: vercel build runs next build internally with Vercel env vars
      - name: Build project with Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PREVIEW || secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if ! vercel build --token="$VERCEL_TOKEN"; then
            echo "Cached Vercel build failed; clearing .next/cache and retrying clean build..."
            rm -rf .next .vercel/output
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy PR preview
        id: vercel_preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_PREVIEW || secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          echo "Deploying PR preview..."
          err_file="$(mktemp)"
          out="$(vercel deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" 2>"$err_file")"
          rc=$?
          cat "$err_file" >&2
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if grep -qiE 'api-deployments-free-per-day|Resource is limited' "$err_file"; then
              echo "::warning::Vercel Hobby daily deployment quota reached; marking PR comment without failing code gates."
              gh pr comment "$PR_NUMBER" --body "<!-- vercel-quota-limit:sha=${HEAD_SHA} -->**Vercel 每日免費預覽部署額度已達上限**（\`api-deployments-free-per-day\`），程式碼與測試檢查不受影響，待額度重置後可重新觸發預覽。" || true
              echo "quota_skipped=true" >> "$GITHUB_OUTPUT"
              rm -f "$err_file"
              exit 0
            fi
            rm -f "$err_file"
            exit "$rc"
          fi
          rm -f "$err_file"
          url="$(printf '%s\n' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Auto-capture UI evidence screenshots on PR Preview
        id: ui_evidence
        if: steps.vercel_preview.outputs.quota_skipped != 'true'
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.vercel_preview.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          touch .evidence-markdown.txt
          SMOKE_FILE=$(mktemp)
          printf 'smoke' > "$SMOKE_FILE"
          GITHUB_HEAD_REF="${GITHUB_HEAD_REF:-smoke/dry-run}" node .agents/scripts/tracker-ops.mjs publish-evidence --dry-run "$SMOKE_FILE" >/dev/null
          rm -f "$SMOKE_FILE"
          if [ -z "$PREVIEW_URL" ]; then exit 0; fi

          # Skip blind visitor fallback capture if the PR body already embeds
          # interactive Playwright E2E screenshots published to pr-evidence.
          EXISTING_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          if printf '%s' "$EXISTING_BODY" | grep -q 'pr-evidence'; then
            echo "PR already embeds interactive pr-evidence screenshots; skipping visitor fallback capture."
            exit 0
          fi

          git fetch origin "$BASE_REF" --depth=20 || true
          CHANGED_UI=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- 'src/app/' 'src/components/' 'src/styles/' | grep -vE '\.(test|spec|stories)\.(ts|tsx)$' || true)
          if [ -z "$CHANGED_UI" ]; then
            echo "No UI-facing files changed; skipping screenshot capture."
            exit 0
          fi

          # Infer public routes from changed src/app/**/page.tsx files, defaulting to /
          ROUTES=$(echo "$CHANGED_UI" | sed -n 's|^src/app||; s|/page\.tsx$||p' | sed 's|([^/]*)||g; s|//|/|g; s|^$|/|' | grep -v '\[' | sort -u | head -n 3 | paste -sd, -)
          if [ -z "$ROUTES" ]; then ROUTES="/"; fi

          echo "Capturing UI evidence on $PREVIEW_URL for routes: $ROUTES"
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" -o ~/.local/share/fonts/NotoSansTC.ttf || true
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf" -o ~/.local/share/fonts/NotoSansCJKtc-Regular.otf || true
          fc-cache -f ~/.local/share/fonts || true
          npx playwright install chromium
          mkdir -p .agents/tmp/evidence
          node scripts/capture-ui-evidence.mjs --base-url "$PREVIEW_URL" --routes "$ROUTES" --role visitor --viewport desktop || true
          node scripts/capture-ui-evidence.mjs --base-url "$PREVIEW_URL" --routes "$ROUTES" --role visitor --viewport mobile || true

          if ls .agents/tmp/evidence/*.png >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            export EVIDENCE_BRANCH="pr-evidence"
            URLS=$(node .agents/scripts/tracker-ops.mjs publish-evidence .agents/tmp/evidence/*.png || true)
            for u in $URLS; do
              label=$(basename "$u" .png)
              echo "![${label}](${u})" >> .evidence-markdown.txt
            done
          fi

      - name: Post PR comment (preview URL + UI screenshots)
        if: steps.vercel_preview.outputs.quota_skipped != 'true' && steps.vercel_preview.outputs.url != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.vercel_preview.outputs.url }}
        with:
          script: |
            const fs = require('fs');
            const evidenceMd = fs.existsSync('.evidence-markdown.txt')
              ? fs.readFileSync('.evidence-markdown.txt', 'utf8').trim()
              : '';
            const previewUrl = process.env.PREVIEW_URL;

            const bodyParts = [
              '## PR Preview Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Preview URL** | ${previewUrl} |`,
              '| **Status** | Deployed |',
              '',
            ];

            if (evidenceMd) {
              bodyParts.push('### Auto-Captured UI Evidence', '', evidenceMd, '');
            }

            const body = bodyParts.join('\n');

            // If the PR body currently has "## Screenshot\n\nN/A", replace N/A with the auto-captured screenshots
            if (evidenceMd) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                });
                if (
                  pr.body &&
                  /## Screenshot\s+N\/A(?:\s*\([^)]*\))?/i.test(pr.body)
                ) {
                  const updatedPrBody = pr.body.replace(
                    /## Screenshot\s+N\/A(?:\s*\([^)]*\))?/i,
                    `## Screenshot\n\n${evidenceMd}`
                  );
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    body: updatedPrBody,
                  });
                }
              } catch (e) {
                console.warn('Could not auto-update PR body screenshots:', e.message);
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('PR Preview Deployment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
