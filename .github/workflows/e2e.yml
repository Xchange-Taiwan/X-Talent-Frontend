name: E2E

on:
  schedule:
    - cron: '0 0 * * 0' # Run once a week (Sunday at midnight UTC)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL'
        required: false
        default: 'https://xtalentdev.vercel.app'

jobs:
  # Purely mocked, no-credentials-needed projects (chromium-onboarding/-anon/
  # -profile/-reservation): pure frontend behavior, no real backend or
  # credentials involved.
  e2e-mock:
    runs-on: ubuntu-latest
    name: Playwright E2E (mock)
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e:mock
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Everything that hits the real, deployed backend: the single-account login
  # smoke test (setup/chromium) and the dual-role mentor<->mentee canary
  # (setup-canary/chromium-canary, X-Tracker #686/#687). This workflow only
  # runs on a weekly schedule or a manual workflow_dispatch - it does not gate
  # any PR or production deploy (see deploy-prod.yml's own separate curl-based
  # smoke test for that) - so there's no continue-on-error split by
  # flakiness-tolerance here: whoever manually triggers this before shipping
  # wants a plain, unconditional pass/fail read on the real backend, canary
  # included.
  e2e-real:
    runs-on: ubuntu-latest
    name: Playwright E2E (real backend)
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}
      # NOTE FOR REVIEWER: these four secrets must be added to this repo's
      # GitHub Actions secrets manually - that's an operational step outside
      # this PR's code changes.
      E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL }}
      E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD }}
      E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL }}
      E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright real-backend tests
        run: pnpm test:e2e:backend
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-real

      - name: Upload Playwright real-backend report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-real
          path: playwright-report-real/
          retention-days: 14
