name: E2E

on:
  schedule:
    - cron: '0 0 * * 0' # Run once a week (Sunday at midnight UTC)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL'
        required: false
        default: 'https://xtalentdev.vercel.app'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Playwright E2E
    # Run scheduled or triggered runs against dev environment.
    # Let the run fail loudly so the result is unambiguous in the Actions UI.
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}
      # Single-account real login (setup/chromium) and dual-role real-backend
      # canary (setup-canary/chromium-canary, X-Tracker #686/#687) both need
      # real credentials, distinct from DESIGN_AUDIT_MENTOR_*/
      # DESIGN_AUDIT_MENTEE_* (a different, unrelated script). The single-
      # account login reuses E2E_MENTEE_* - there was never a separate
      # E2E_EMAIL account. NOTE FOR REVIEWER: these four secrets must be
      # added to this repo's GitHub Actions secrets manually - that's an
      # operational step outside this PR's code changes.
      E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL }}
      E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD }}
      E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL }}
      E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      # Mocked, no-credentials-needed projects (chromium-onboarding/-anon/
      # -profile/-reservation): pure frontend behavior, no real backend
      # involved, so a failure here is always a real regression. Let it fail
      # the job loudly.
      - name: Run Playwright tests
        run: pnpm test:e2e:mock
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      # Everything that hits the real backend (single-account login smoke
      # test + dual-role canary, X-Tracker #686/#687): continue-on-error so a
      # real-backend flake there never reds the mock step above, and reports
      # to its own HTML output so the two are always separately judgeable,
      # never merged into one report.
      - name: Run Playwright backend tests
        continue-on-error: true
        run: pnpm test:e2e:backend
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-backend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright backend report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-backend
          path: playwright-report-backend/
          retention-days: 14
