name: E2E

on:
  schedule:
    - cron: '0 0 * * 0' # Run once a week (Sunday at midnight UTC)
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL'
        required: false
        default: 'https://xtalentdev.vercel.app'

jobs:
  # Purely mocked, no-credentials-needed projects (chromium-onboarding/-anon/
  # -profile/-reservation): pure frontend behavior, no real backend or
  # credentials involved. A failure here is always a real regression.
  e2e-mock:
    runs-on: ubuntu-latest
    name: Playwright E2E (mock)
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e:mock
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Single-account real login smoke test (setup/chromium): the one real
  # backend check meant to be a reliable, unconditional regression signal -
  # not a flakiness-prone real business flow like e2e-canary below, so it
  # gets its own blocking job rather than being lumped into either e2e-mock
  # (misleadingly, since it's not mocked) or e2e-canary (which would make a
  # genuine login regression silently non-blocking).
  e2e-auth:
    runs-on: ubuntu-latest
    name: Playwright E2E (auth)
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}
      # Reuses the mentee canary credentials below - there was never a
      # separate E2E_EMAIL account. NOTE FOR REVIEWER: E2E_MENTEE_* must be
      # added to this repo's GitHub Actions secrets manually - that's an
      # operational step outside this PR's code changes.
      E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL }}
      E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright auth tests
        run: pnpm exec playwright test --project=setup --project=chromium
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-auth

      - name: Upload Playwright auth report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth
          path: playwright-report-auth/
          retention-days: 14

  # Dual-role real-backend canary only (X-Tracker #686/#687): a genuinely
  # real, unmocked mentor<->mentee flow against a live deployed backend, so
  # it's the one project prone to real network/timing flakiness. Runs as its
  # own job with continue-on-error so it shows up as its own
  # separately-judgeable check - a flake here can never be conflated with (or
  # silently mask a regression in) e2e-mock or e2e-auth above, both of which
  # stay a hard, unconditional signal.
  e2e-canary:
    runs-on: ubuntu-latest
    name: Playwright E2E (canary)
    continue-on-error: true
    env:
      BASE_URL: ${{ inputs.base_url || 'https://xtalentdev.vercel.app' }}
      # NOTE FOR REVIEWER: these four secrets must be added to this repo's
      # GitHub Actions secrets manually - that's an operational step outside
      # this PR's code changes.
      E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL }}
      E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD }}
      E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL }}
      E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm playwright install --with-deps chromium

      - name: Run Playwright canary tests
        run: pnpm exec playwright test --project=setup-canary --project=chromium-canary
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report-canary

      - name: Upload Playwright canary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-canary
          path: playwright-report-canary/
          retention-days: 14
