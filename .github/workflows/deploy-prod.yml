# ==============================================================================
# PRODUCTION DEPLOYMENT & ROLLBACK PROCEDURES
# Automated rollback is active: before deploying, the workflow records the
# current active production deployment ID and automatically executes
# `vercel rollback <prev-id>` if post-deploy boundary verification fails.
# Manual fallback: promote a stable deployment in the Vercel Dashboard or run
# `vercel rollback <stable-deployment-id> --yes`.
# ==============================================================================

name: Deploy to Vercel (Production)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'e2e/**'
      - '.github/**'
      - '.agents/**'
      - '.gemini/**'
      - '.husky/**'
      - '.lavish/**'
      - '.storybook/**'
      - '.vscode/**'
      - 'docs/**'
      - '**/*.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.stories.ts'
      - '**/*.stories.tsx'
      - 'playwright.config.ts'
      - 'vitest.config.mts'
      - 'tsconfig.test.json'
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Install Vercel CLI
        run: npm install --global vercel@51.2.1

      - name: Record current stable production deployment for auto-rollback
        id: prev_prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          PREV_ID=$(curl -fsSL -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            | jq -r '.targets.production.id // empty' || true)
          echo "deployment_id=${PREV_ID}" >> "$GITHUB_OUTPUT"
          echo "Recorded previous production deployment ID: ${PREV_ID:-none}"

      - name: Pull Vercel environment info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: xchange-6j
          SENTRY_PROJECT: x-talent-frontend
          SENTRY_RELEASE: ${{ github.sha }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying to Vercel Production..."
          out=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1 || true)
          if [ -z "$url" ]; then
            url=$(printf '%s\n' "$out" | tail -n 1 | tr -d '[:space:]')
          fi
          if [ -n "$url" ] && [[ ! "$url" =~ ^https?:// ]]; then
            url="https://$url"
          fi
          echo "vercel_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Run Production Domain & Boundary Verification
        id: smoke_test
        run: |
          node scripts/verify-deployment-boundaries.mjs \
            --site-url "https://xtalent.xchange.com.tw" \
            --env-file ".vercel/.env.production.local" \
            --static-dir ".vercel/output/static"

      - name: Auto-rollback to previous stable production deployment on failure
        if: failure() && steps.smoke_test.outcome == 'failure' && steps.prev_prod.outputs.deployment_id != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PREV_ID: ${{ steps.prev_prod.outputs.deployment_id }}
        run: |
          echo "Boundary verification failed; initiating automatic rollback to ${PREV_ID}..."
          vercel rollback "$PREV_ID" --yes --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"

      - name: Notify on failure
        if: failure() && steps.smoke_test.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.vercel_url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            const commitSha = context.sha;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            const body = `🚨 **Production Deployment Smoke Test Failed!** 🚨\n\n` +
                         `The smoke test for deployment **${url}** has failed.\n\n` +
                         `Please check the [Workflow Run](${repoUrl}/actions/runs/${context.runId}) for details.`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              body: body
            });
