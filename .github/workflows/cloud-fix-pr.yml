name: Cloud AI Fix PR

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'X-Talent-Tracker Issue Number (e.g. 780)'
        required: true
        type: string
      pr_number:
        description: 'X-Talent-Frontend Pull Request Number (e.g. 1198)'
        required: true
        type: string
      fix_instructions:
        description: 'Optional custom fix instructions from Discord Modal (Suggestion 2)'
        required: false
        default: ''
        type: string
      max_review_rounds:
        description: 'Maximum deterministic + E2E self-healing rounds (1-10)'
        required: false
        default: '3'
        type: string
      run_e2e:
        description: 'Run Playwright E2E suite in each convergence round'
        required: false
        default: 'true'
        type: string
      requester:
        description: 'GitHub username of the engineer who triggered this run'
        required: false
        default: 'LowSugarCoke'
        type: string

concurrency:
  group: cloud-fix-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GEMINI_MODEL: gemini-4-carbon
  GEMINI_CLI_TRUST_WORKSPACE: 'true'
  WORKER_CALLBACK_URL: 'https://x-talent-discord-mention-notify.x-talent.workers.dev/__cloud-callback'

jobs:
  fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: 'Cloud AI Fix PR #${{ inputs.pr_number }} (#${{ inputs.ticket_number }})'
    steps:
      - name: Validate inputs and notify Discord Worker (fix_pr_started)
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          TICKET_NUMBER: ${{ inputs.ticket_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MAX_REVIEW_ROUNDS: ${{ inputs.max_review_rounds }}
          RUN_E2E: ${{ inputs.run_e2e }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLEAN_TICKET="${TICKET_NUMBER//#/}"
          CLEAN_TICKET="${CLEAN_TICKET//[[:space:]]/}"
          CLEAN_PR="${PR_NUMBER//#/}"
          CLEAN_PR="${CLEAN_PR//[[:space:]]/}"
          if ! [[ "$CLEAN_TICKET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ticket_number '${TICKET_NUMBER}'. Must be a positive integer."
            exit 1
          fi
          if ! [[ "$CLEAN_PR" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pr_number '${PR_NUMBER}'. Must be a positive integer."
            exit 1
          fi
          echo "SAFE_TICKET_NUMBER=${CLEAN_TICKET}" >> "$GITHUB_ENV"
          echo "SAFE_PR_NUMBER=${CLEAN_PR}" >> "$GITHUB_ENV"

          CLEAN_ROUNDS="${MAX_REVIEW_ROUNDS//[[:space:]]/}"
          if ! [[ "$CLEAN_ROUNDS" =~ ^[0-9]+$ ]] || [ "$CLEAN_ROUNDS" -lt 1 ]; then
            CLEAN_ROUNDS="3"
          elif [ "$CLEAN_ROUNDS" -gt 10 ]; then
            CLEAN_ROUNDS="10"
          fi
          echo "SAFE_MAX_ROUNDS=${CLEAN_ROUNDS}" >> "$GITHUB_ENV"

          CLEAN_E2E="${RUN_E2E//[[:space:]]/}"
          if [ "$CLEAN_E2E" = "false" ] || [ "$CLEAN_E2E" = "0" ]; then
            echo "SAFE_RUN_E2E=false" >> "$GITHUB_ENV"
          else
            echo "SAFE_RUN_E2E=true" >> "$GITHUB_ENV"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg prNumber "$CLEAN_PR" \
              --arg status "fix_pr_started" \
              --arg runUrl "$RUN_URL" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                prNumber: ($prNumber | tonumber? // null),
                status: $status,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi

      - name: Checkout repository and PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 'Check out PR #${{ inputs.pr_number }}'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ env.SAFE_PR_NUMBER }}
        run: |
          gh pr checkout "$PR_NUMBER"
          git config user.name "x-talent-cloud-agent[bot]"
          git config user.email "x-talent-cloud-agent[bot]@users.noreply.github.com"
          git fetch origin develop --quiet || true

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with PNPM cache (Suggestion 6)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (Suggestion 6)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium

      - name: Install Noto CJK fonts for crisp Traditional Chinese rendering
        continue-on-error: true
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" -o ~/.local/share/fonts/NotoSansTC.ttf || true
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf" -o ~/.local/share/fonts/NotoSansCJKtc-Regular.otf || true
          fc-cache -f ~/.local/share/fonts || true

      - name: Configure Git and local environment for UI evidence and E2E
        env:
          BFF_OPENAPI_URL: ${{ secrets.BFF_OPENAPI_URL || vars.BFF_OPENAPI_URL }}
          DESIGN_AUDIT_MENTOR_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTOR_EMAIL || secrets.E2E_MENTOR_EMAIL }}
          DESIGN_AUDIT_MENTOR_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTOR_PASSWORD || secrets.E2E_MENTOR_PASSWORD }}
          DESIGN_AUDIT_MENTEE_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTEE_EMAIL || secrets.E2E_MENTEE_EMAIL }}
          DESIGN_AUDIT_MENTEE_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTEE_PASSWORD || secrets.E2E_MENTEE_PASSWORD }}
          E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL || secrets.DESIGN_AUDIT_MENTOR_EMAIL }}
          E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD || secrets.DESIGN_AUDIT_MENTOR_PASSWORD }}
          E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL || secrets.DESIGN_AUDIT_MENTEE_EMAIL }}
          E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD || secrets.DESIGN_AUDIT_MENTEE_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash .agents/scripts/setup-cloud-env.sh

      - name: Run Gemini CLI for initial PR Fix (Phase 1)
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          PR_NUMBER: ${{ env.SAFE_PR_NUMBER }}
          FIX_INSTRUCTIONS: ${{ inputs.fix_instructions }}
        run: |
          mkdir -p .agents/tmp
          rm -f .agents/tmp/scope-guidance.md .agents/tmp/merge-conflicts.md
          MERGE_CONFLICTS_PRESENT="false"
          bash .agents/scripts/unstage-cloud-locks.sh --restore-worktree
          if ! git merge origin/develop --no-edit; then
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U || true)
            if [ -n "$CONFLICT_FILES" ]; then
              {
                echo "## ⚠️ 與最新 origin/develop 發生合併衝突（請優先解開衝突標記）"
                echo "以下檔案存在 Git 合併衝突標記（\`<<<<<<<\` / \`=======\` / \`>>>>>>>\`），請務必保留雙方有效功能並徹底清除所有衝突標記："
                echo "$CONFLICT_FILES" | sed 's/^/- `/' | sed 's/$/`/'
              } > .agents/tmp/merge-conflicts.md
              MERGE_CONFLICTS_PRESENT="true"
            else
              git merge --abort || true
            fi
          fi
          bash .agents/scripts/setup-cloud-env.sh
          GH_TOKEN="${TRACKER_READ_TOKEN:-$GH_TOKEN}" node scripts/export-ticket-spec.mjs --ticket="$TICKET_NUMBER" --repo="Xchange-Taiwan/X-Talent-Tracker" --out=.agents/tmp/ticket-spec.md 2>/dev/null || true
          node scripts/check-ticket-scope.mjs --spec-file=.agents/tmp/ticket-spec.md --guidance-out=.agents/tmp/scope-guidance.md >/dev/null 2>&1 || true
          SCOPE_GUIDANCE=""
          if [ -s .agents/tmp/scope-guidance.md ]; then
            SCOPE_GUIDANCE=$(cat .agents/tmp/scope-guidance.md)
          fi
          ARCH_QUERY="#${TICKET_NUMBER} $(head -n 25 .agents/tmp/ticket-spec.md 2>/dev/null | tr '\n' ' ' || echo '')"
          jq -n --arg q "$ARCH_QUERY" '{query: $q}' | curl -sS -X POST "https://x-talent-discord-mention-notify.x-talent.workers.dev/__arch-kb" -H "Content-Type: application/json" -d @- | jq -r 'if .kb then "\n\n## X-Talent 跨專案架構知識庫 (Cloudflare KV Architecture KB)\n```json\n" + (.kb | tojson) + "\n```" else "" end' >> .agents/tmp/ticket-spec.md 2>/dev/null || true
          if [ -s .agents/tmp/merge-conflicts.md ]; then
            cat .agents/tmp/merge-conflicts.md >> .agents/tmp/ticket-spec.md
          fi
          gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" | jq -rs '[.[][] | select(.body | contains("ai-review-pipeline"))] | last | if . then "\n\n## 目前 PR 線上 AI Review 審查意見（含 Visual / Design Parity 視覺比對）\n" + .body else "" end' >> .agents/tmp/ticket-spec.md 2>/dev/null || true
          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid // empty' 2>/dev/null || echo "")
          if [ -n "$PR_HEAD_SHA" ]; then
            node -e '
              const { execFileSync } = require("node:child_process");
              const [repo, sha] = process.argv.slice(1);
              try {
                const raw = execFileSync("gh", ["api", `repos/${repo}/commits/${sha}/check-runs?per_page=50`], { encoding: "utf8" });
                const runs = (JSON.parse(raw).check_runs || []).filter(c => c.conclusion === "failure" && !/Vercel/i.test(c.name || ""));
                if (!runs.length) process.exit(0);
                const out = ["\n\n## 目前 PR 失敗的 CI Checks 與 CodeQL 註記（請一併修復）"];
                for (const r of runs) {
                  out.push(`\n### ${r.name}`);
                  if (r.output?.title) out.push(`- 摘要：${r.output.title}`);
                  try {
                    const annRaw = execFileSync("gh", ["api", `repos/${repo}/check-runs/${r.id}/annotations`], { encoding: "utf8" });
                    const anns = JSON.parse(annRaw) || [];
                    for (const a of anns.filter(x => x.path && x.path !== ".github").slice(0, 15)) {
                      out.push(`- \`${a.path}:${a.start_line || 1}\` [${a.annotation_level}] ${a.title ? a.title + ": " : ""}${String(a.message || "").trim().slice(0, 400)}`);
                    }
                  } catch {}
                }
                console.log(out.join("\n"));
              } catch {}
            ' "${{ github.repository }}" "$PR_HEAD_SHA" >> .agents/tmp/ticket-spec.md 2>/dev/null || true
          fi
          node scripts/prefetch-ticket-visuals.mjs --ticket="$TICKET_NUMBER" || true

          PROMPT_FILE=$(mktemp)
          printf '我們正在處理 PR #%s（對應 Ticket #%s，完整規格、線上 AI Review 意見、合併衝突清單與視覺參考圖位於 .agents/tmp/ticket-spec.md）。\n' "$PR_NUMBER" "$TICKET_NUMBER" > "$PROMPT_FILE"
          if [ -n "$FIX_INSTRUCTIONS" ]; then
            printf '工程師下達了以下具體修改指示：\n「%s」\n' "$FIX_INSTRUCTIONS" >> "$PROMPT_FILE"
          fi
          cat <<'EOF' >> "$PROMPT_FILE"
          請依序執行：
          1. 先讀取 .agents/tmp/ticket-spec.md；若列有合併衝突檔案，請務必先完整解開所有衝突標記（<<<<<<< / ======= / >>>>>>>）；若列有 .agents/tmp/ticket-images/ 設計參考圖或 -dom.md 摘要，改 UI 前請用 read_file 檢視細節，且切勿改壞既有已定案文案。
          2. 優先針對上述修改指示（若有）、合併衝突、失敗的 CI Checks 與線上 AI Review 中的實質 Bug／規格漏做／視覺裁切完成修復（嚴禁手動修改自動產生的 src/types/api.ts；嚴禁修改 .storybook/storiesCoverage.test.tsx）。
          3. 極速批次修復規範：所有檔案修改儲存後請立即結束回覆（Phase 2 漏斗快篩會自動平行執行 lint、type-check、單元測試與 Turbopack E2E 截圖重拍）。
          EOF
          printf '\n%s\n' "$SCOPE_GUIDANCE" >> "$PROMPT_FILE"
          npx gemini -m "$GEMINI_MODEL" --approval-mode=yolo --skip-trust -p "$(cat "$PROMPT_FILE")"
          rm -f "$PROMPT_FILE"

          # If merge was in progress, verify Gemini cleared all conflict markers and commit the merge cleanly before Phase 2
          if [ "$MERGE_CONFLICTS_PRESENT" = "true" ] && [ -f .git/MERGE_HEAD ]; then
            if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!.agents/tmp/**' >/dev/null 2>&1; then
              echo "::error::Unresolved Git conflict markers remain after Phase 1; aborting failed merge."
              git merge --abort || true
              exit 1
            fi
            git add -A
            bash .agents/scripts/unstage-cloud-locks.sh --restore-worktree
            git commit --no-edit -m "chore: merge origin/develop and resolve conflicts for PR #${PR_NUMBER}"
            bash .agents/scripts/setup-cloud-env.sh
          fi

      - name: Run Fast Funnel Deterministic & Playwright E2E Verification Loop (Phase 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          MAX_AI_REVIEW_ROUNDS: ${{ env.SAFE_MAX_ROUNDS }}
          RUN_E2E: ${{ env.SAFE_RUN_E2E }}
          CONVERGE_MAX_DURATION_MS: '1500000'
        run: |
          node scripts/cloud-converge-loop.mjs \
            --ticket="$TICKET_NUMBER" \
            --max-rounds="$MAX_AI_REVIEW_ROUNDS" \
            --run-e2e="$RUN_E2E" \
            --run-ai-review=false \
            --require-ui-evidence="$RUN_E2E"

      - name: Commit and push converged fixes to PR branch (Phase 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          PR_NUMBER: ${{ env.SAFE_PR_NUMBER }}
        run: bash .agents/scripts/cloud-submit-pr.sh fix-pr

      - name: Finalize and notify Discord Worker (Suggestion 4 auto-recovery & Vercel limit detection)
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER || inputs.ticket_number }}
          PR_NUMBER: ${{ env.SAFE_PR_NUMBER || inputs.pr_number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env.development.local .env.e2e.local
          CLEAN_TICKET=$(printf '%s' "$TICKET_NUMBER" | tr -cd '0-9')
          CLEAN_PR=$(printf '%s' "$PR_NUMBER" | tr -cd '0-9')

          PR_URL="https://github.com/${{ github.repository }}/pull/${CLEAN_PR}"
          VERCEL_LIMIT="false"
          if [ -n "$CLEAN_PR" ]; then
            if gh api --paginate "repos/${{ github.repository }}/issues/${CLEAN_PR}/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qiE 'vercel-quota-limit|api-deployments-free-per-day'; then
              VERCEL_LIMIT="true"
            fi
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="fix_pr_succeeded"
            MSG="雲端 Fix PR #${CLEAN_PR} 已完成修復與測試截圖更新並推回分支"
          else
            STATUS="fix_pr_failed"
            MSG="雲端 Fix PR #${CLEAN_PR} 執行未完全通過（狀態: ${JOB_STATUS}），按鈕已自動解鎖可重試"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "$STATUS" \
              --arg prNumber "$CLEAN_PR" \
              --arg prUrl "$PR_URL" \
              --arg message "$MSG" \
              --arg runUrl "$RUN_URL" \
              --argjson vercelLimitReached "$VERCEL_LIMIT" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                prNumber: ($prNumber | tonumber? // null),
                status: $status,
                prUrl: $prUrl,
                message: $message,
                vercelLimitReached: $vercelLimitReached,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi
