name: Code Quality Check

on:
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Format and Lint Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed file categories
        id: paths
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-ci-paths.mjs --base "$BASE_REF"

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Cache ESLint and TypeScript incremental state
        uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-lint-ts-${{ hashFiles('pnpm-lock.yaml', '.eslintrc.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-ts-${{ hashFiles('pnpm-lock.yaml', '.eslintrc.js', 'tsconfig.json') }}-
            ${{ runner.os }}-lint-ts-

      - name: Check Prettier formatting
        id: prettier-check
        run: pnpm run format:check

      - name: Run ESLint (cached single pass)
        id: eslint-check
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm exec eslint . --ext .js,.jsx,.ts,.tsx --cache

      - name: TypeScript type check
        id: type-check
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm run type-check

      - name: Design token drift check
        id: token-check
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm run generate:tokens:check

      - name: School directory list drift check
        id: school-check
        if: steps.paths.outputs.docs_only != 'true'
        run: pnpm run generate:schools:check

      - name: Verify Storybook static build when stories or Storybook config changed
        id: storybook-check
        if: steps.paths.outputs.needs_storybook_build == 'true'
        run: pnpm run build-storybook --quiet

      - name: Summary
        if: always()
        env:
          PRETTIER_OUTCOME: ${{ steps.prettier-check.outcome }}
          ESLINT_OUTCOME: ${{ steps.eslint-check.outcome }}
          TYPE_OUTCOME: ${{ steps.type-check.outcome }}
          TOKEN_OUTCOME: ${{ steps.token-check.outcome }}
          SCHOOL_OUTCOME: ${{ steps.school-check.outcome }}
          STORYBOOK_OUTCOME: ${{ steps.storybook-check.outcome }}
        run: |
          {
            echo "## Code Quality Check Summary"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Prettier | ${PRETTIER_OUTCOME} |"
            echo "| ESLint | ${ESLINT_OUTCOME} |"
            echo "| TypeScript | ${TYPE_OUTCOME} |"
            echo "| Design Tokens | ${TOKEN_OUTCOME} |"
            echo "| School List | ${SCHOOL_OUTCOME} |"
            echo "| Storybook Build | ${STORYBOOK_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"
