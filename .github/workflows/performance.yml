name: Bundle Size Budget

on:
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Budgets (gzipped kB measured directly from Next.js 16 .next client chunk manifests)
env:
  PAGE_SIZE_WARN_KB: '55'
  PAGE_SIZE_FAIL_KB: '90'
  FIRST_LOAD_WARN_KB: '465'
  FIRST_LOAD_FAIL_KB: '520'
  SHARED_BASE_WARN_KB: '425'
  SHARED_BASE_FAIL_KB: '455'

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    name: Bundle Size Budget Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up environment
        uses: ./.github/actions/setup-env

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'next.config.js', 'tailwind.config.js', 'postcss.config.js') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build project
        run: pnpm run build

      - name: Check bundle size budgets
        id: budget
        continue-on-error: true
        run: node scripts/check-bundle-budget.mjs --out .bundle-report.json --md-out .bundle-report.md

      - name: Post PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.bundle-report.md')) {
              console.log('No bundle report found.');
              return;
            }
            const body = fs.readFileSync('.bundle-report.md', 'utf8').trim();

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('Bundle Size Budget')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Fail on budget violations
        if: steps.budget.outputs.passed != 'true'
        env:
          VIOLATIONS: ${{ steps.budget.outputs.violations }}
        run: |
          echo "Bundle size budget check failed (${VIOLATIONS:-unknown} violation(s))."
          exit 1
