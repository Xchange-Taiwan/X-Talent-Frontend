name: Cloud AI Implement Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'X-Talent-Tracker Issue Number (e.g. 780)'
        required: true
        type: string
      branch_name:
        description: 'Optional existing branch promoted from local (e.g. feat/780-slug)'
        required: false
        default: ''
        type: string
      max_review_rounds:
        description: 'Maximum pre-PR AI Review convergence rounds (1-20)'
        required: false
        default: '20'
        type: string
      run_e2e:
        description: 'Run Playwright E2E suite in each pre-PR convergence round'
        required: false
        default: 'true'
        type: string
      requester:
        description: 'GitHub username of the engineer who triggered this run'
        required: false
        default: 'LowSugarCoke'
        type: string
      extra_prompt:
        description: 'Optional extra implementation instructions'
        required: false
        default: ''
        type: string

concurrency:
  group: cloud-implement-ticket-${{ inputs.ticket_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GEMINI_MODEL: gemini-4-argon
  GEMINI_CLI_TRUST_WORKSPACE: 'true'
  WORKER_CALLBACK_URL: 'https://x-talent-discord-mention-notify.x-talent.workers.dev/__cloud-callback'

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: 'Cloud AI Implement #${{ inputs.ticket_number }}'
    steps:
      - name: Validate inputs and notify Discord Worker (implement_started)
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          TICKET_NUMBER: ${{ inputs.ticket_number }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          MAX_REVIEW_ROUNDS: ${{ inputs.max_review_rounds }}
          RUN_E2E: ${{ inputs.run_e2e }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLEAN_TICKET="${TICKET_NUMBER//#/}"
          CLEAN_TICKET="${CLEAN_TICKET//[[:space:]]/}"
          if ! [[ "$CLEAN_TICKET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ticket_number '${TICKET_NUMBER}'. Must be a positive integer."
            exit 1
          fi
          echo "SAFE_TICKET_NUMBER=${CLEAN_TICKET}" >> "$GITHUB_ENV"

          CLEAN_BRANCH="${BRANCH_NAME//[[:space:]]/}"
          if [ -n "$CLEAN_BRANCH" ]; then
            if ! [[ "$CLEAN_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$CLEAN_BRANCH" == *".."* ]] || [[ "$CLEAN_BRANCH" == -* ]] || [[ "$CLEAN_BRANCH" == /* ]]; then
              echo "::error::Invalid branch_name '${BRANCH_NAME}'."
              exit 1
            fi
          fi
          echo "SAFE_BRANCH_NAME=${CLEAN_BRANCH}" >> "$GITHUB_ENV"

          CLEAN_ROUNDS="${MAX_REVIEW_ROUNDS//[[:space:]]/}"
          if ! [[ "$CLEAN_ROUNDS" =~ ^[0-9]+$ ]] || [ "$CLEAN_ROUNDS" -lt 1 ]; then
            CLEAN_ROUNDS="20"
          elif [ "$CLEAN_ROUNDS" -gt 20 ]; then
            CLEAN_ROUNDS="20"
          fi
          echo "SAFE_MAX_ROUNDS=${CLEAN_ROUNDS}" >> "$GITHUB_ENV"

          CLEAN_E2E="${RUN_E2E//[[:space:]]/}"
          if [ "$CLEAN_E2E" = "false" ] || [ "$CLEAN_E2E" = "0" ]; then
            echo "SAFE_RUN_E2E=false" >> "$GITHUB_ENV"
          else
            echo "SAFE_RUN_E2E=true" >> "$GITHUB_ENV"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "implement_started" \
              --arg runUrl "$RUN_URL" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with PNPM cache (Suggestion 6)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (Suggestion 6)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium

      - name: Configure Git and local environment for UI evidence and E2E
        env:
          BFF_OPENAPI_URL: ${{ secrets.BFF_OPENAPI_URL || vars.BFF_OPENAPI_URL }}
          DESIGN_AUDIT_MENTOR_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTOR_EMAIL || secrets.E2E_MENTOR_EMAIL }}
          DESIGN_AUDIT_MENTOR_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTOR_PASSWORD || secrets.E2E_MENTOR_PASSWORD }}
          DESIGN_AUDIT_MENTEE_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTEE_EMAIL || secrets.E2E_MENTEE_EMAIL }}
          DESIGN_AUDIT_MENTEE_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTEE_PASSWORD || secrets.E2E_MENTEE_PASSWORD }}
          E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL || secrets.DESIGN_AUDIT_MENTOR_EMAIL }}
          E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD || secrets.DESIGN_AUDIT_MENTOR_PASSWORD }}
          E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL || secrets.DESIGN_AUDIT_MENTEE_EMAIL }}
          E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD || secrets.DESIGN_AUDIT_MENTEE_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash .agents/scripts/setup-cloud-env.sh

      - name: Run Gemini CLI to implement or complete ticket requirements (Phase 1)
        id: gemini_implement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          BRANCH_NAME: ${{ env.SAFE_BRANCH_NAME }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        run: |
          mkdir -p .agents/tmp
          GH_TOKEN="${TRACKER_READ_TOKEN:-$GH_TOKEN}" gh issue view "$TICKET_NUMBER" --repo Xchange-Taiwan/X-Talent-Tracker --comments > .agents/tmp/ticket-spec.md 2>/dev/null || true
           ARCH_QUERY="#${TICKET_NUMBER} $(head -n 25 .agents/tmp/ticket-spec.md 2>/dev/null | tr '\n' ' ' || echo '')"
          jq -n --arg q "$ARCH_QUERY" '{query: $q}' | curl -sS -X POST "https://x-talent-discord-mention-notify.x-talent.workers.dev/__arch-kb" -H "Content-Type: application/json" -d @- | jq -r 'if .kb then "\n\n## X-Talent 跨專案架構知識庫 (Cloudflare KV Architecture KB)\n```json\n" + (.kb | tojson) + "\n```" else "" end' >> .agents/tmp/ticket-spec.md 2>/dev/null || true

          if [ -n "$BRANCH_NAME" ]; then
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME"
            bash .agents/scripts/link-ticket-branch.sh "$TICKET_NUMBER" "$BRANCH_NAME" || true
            PROMPT="我們正在處理從本地 Promote 上雲端的分支 ${BRANCH_NAME}，對應 https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/${TICKET_NUMBER}（完整 Issue 規格與留言已預先下載至 .agents/tmp/ticket-spec.md）。
            請依序執行：
            1. 直接讀取 .agents/tmp/ticket-spec.md（請勿讀取 .git/config 或重新執行 gh auth），並檢查 git diff origin/develop 與 Issue #${TICKET_NUMBER} 的所有驗收條件（Acceptance Criteria）。
            2. 若有尚未實作完畢的需求、缺少的 Vitest 單元測試或對應的 Playwright E2E (.spec.ts) 測試檔案，請直接補齊程式碼與測試檔案。
            3. 僅執行快速的 pnpm type-check 與 pnpm test（Vitest 單元測試）確保通過。
            4. 效能與流程限制：此階段嚴禁自行執行 pnpm test:e2e、npx playwright test、pnpm build 或啟動 pnpm dev，也請勿執行 gh pr create，因為下一步 Phase 2 (scripts/cloud-converge-loop.mjs) 會自動啟動 Playwright 執行 E2E 驗證與最多 20 輪 AI Review 自癒收斂迴圈。
            ${EXTRA_PROMPT}"
          else
            PROMPT="請針對 https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/${TICKET_NUMBER} 執行第一階段程式碼與測試實作：
            1. Issue #${TICKET_NUMBER} 的完整規格與留言已預先下載至 .agents/tmp/ticket-spec.md，請直接讀取該檔案（請勿讀取 .git/config 或重新執行 gh auth）。
            2. 執行 bash .agents/scripts/link-ticket-branch.sh ${TICKET_NUMBER} 建立並綁定 Linked Branch，確認看板移至 In progress。
            3. 根據 Issue #${TICKET_NUMBER} 需求完成程式碼、Vitest 單元測試與對應的 Playwright E2E (.spec.ts) 測試檔案撰寫，並僅執行快速的 pnpm type-check 與 pnpm test（Vitest 單元測試）確保通過。
            4. 效能與流程限制：此階段嚴禁自行執行 pnpm test:e2e、npx playwright test、pnpm build 或啟動 pnpm dev，也請勿執行 gh pr create，因為下一步 Phase 2 (scripts/cloud-converge-loop.mjs) 會自動啟動 Playwright 執行 E2E 驗證與最多 20 輪 AI Review 自癒收斂迴圈，收斂完成後再統一截圖與開立 PR。
            ${EXTRA_PROMPT}"
          fi
          npx gemini -m "$GEMINI_MODEL" --approval-mode=yolo --skip-trust -p "$PROMPT"

      - name: Run Pre-PR Multi-Round AI Review & Playwright E2E Convergence Loop (Phase 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          MAX_AI_REVIEW_ROUNDS: ${{ env.SAFE_MAX_ROUNDS }}
          RUN_E2E: ${{ env.SAFE_RUN_E2E }}
        run: |
          node scripts/cloud-converge-loop.mjs \
            --ticket="$TICKET_NUMBER" \
            --max-rounds="$MAX_AI_REVIEW_ROUNDS" \
            --run-e2e="$RUN_E2E"

      - name: Capture UI evidence and submit Pull Request (Phase 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
        run: |
          trap 'rm -f .env.development.local .env.e2e.local' EXIT
          PROMPT="程式碼已通過雲端 Pre-PR 多輪 AI Review 與 Playwright E2E 收斂檢查（摘要位於 .agents/tmp/cloud-converge-summary.md）。
          請針對 Issue #${TICKET_NUMBER} 完成最後提交與開立 PR：
          1. 若 git diff origin/develop 涉及 src/ 下的 UI 元件或頁面變更，請於背景啟動 pnpm dev 並執行 node scripts/capture-ui-evidence.mjs 擷取畫面截圖存入 .agents/tmp/evidence/（若僅修改測試或腳本則無須截圖）。
          2. 遵循 .agents/skills/submit-pr/SKILL.md 流程：發佈截圖至 pr-evidence 分支（若有截圖）、將所有變更 commit 並 git push 至遠端分支。
          3. 使用 gh pr create 開立指向 develop 的 Pull Request（若該分支已有開啟的 PR 則使用 gh pr edit 更新描述），並在 PR 描述中附上 .agents/tmp/cloud-converge-summary.md 的收斂摘要與 Ref: https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/${TICKET_NUMBER}。
          4. 將 Project #7 看板上的 Issue #${TICKET_NUMBER} 狀態更新為 PR Review。"
          npx gemini -m "$GEMINI_MODEL" --approval-mode=yolo --skip-trust -p "$PROMPT"

      - name: Finalize and notify Discord Worker (Suggestion 4 auto-recovery & Vercel limit detection)
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER || inputs.ticket_number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env.development.local .env.e2e.local
          CLEAN_TICKET=$(printf '%s' "$TICKET_NUMBER" | tr -cd '0-9')

          PR_JSON=""
          CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
          if [ -n "$CURRENT_BRANCH" ] && [ "$CURRENT_BRANCH" != "develop" ] && [ "$CURRENT_BRANCH" != "main" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --head "$CURRENT_BRANCH" --state open --json number,url --jq '.[0] // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$PR_JSON" ] && [ -n "$CLEAN_TICKET" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --state open --limit 30 --json number,url,headRefName,title,body 2>/dev/null | jq -c --arg t "$CLEAN_TICKET" '
              map(select(
                (.headRefName | test("(^|/|-)" + $t + "(-|$)")) or
                (.title | test("#" + $t + "(\\b|$)")) or
                (.body // "" | test("(X-Talent-Tracker/issues/|#)" + $t + "(\\b|$)"))
              )) | .[0] // empty
            ' 2>/dev/null || echo "")
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || echo "")
          PR_URL=$(echo "$PR_JSON" | jq -r '.url // empty' 2>/dev/null || echo "")

          VERCEL_LIMIT="false"

          if [ -n "$PR_NUMBER" ] && [ "$JOB_STATUS" = "success" ]; then
            STATUS="implement_succeeded"
            MSG="雲端 AI 已完成多輪 AI Review 與 E2E 收斂並開出 PR #${PR_NUMBER}"
          elif [ -n "$PR_NUMBER" ]; then
            STATUS="implement_succeeded"
            MSG="PR #${PR_NUMBER} 已開出（部分後續步驟需確認）"
          else
            STATUS="implement_failed"
            MSG="雲端實作未成功開出 PR（狀態: ${JOB_STATUS}），按鈕已自動解鎖可重試"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "$STATUS" \
              --arg prNumber "${PR_NUMBER:-0}" \
              --arg prUrl "$PR_URL" \
              --arg message "$MSG" \
              --arg runUrl "$RUN_URL" \
              --argjson vercelLimitReached "$VERCEL_LIMIT" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                prNumber: (if ($prNumber | tonumber? // 0) > 0 then ($prNumber | tonumber) else null end),
                prUrl: (if $prUrl != "" then $prUrl else null end),
                message: $message,
                vercelLimitReached: $vercelLimitReached,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi
