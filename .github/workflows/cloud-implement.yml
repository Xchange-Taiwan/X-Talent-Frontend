name: Cloud AI Implement Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'X-Talent-Tracker Issue Number (e.g. 780)'
        required: true
        type: string
      branch_name:
        description: 'Optional existing branch promoted from local (e.g. feat/780-slug)'
        required: false
        default: ''
        type: string
      max_review_rounds:
        description: 'Maximum deterministic + E2E self-healing rounds (1-10)'
        required: false
        default: '3'
        type: string
      run_e2e:
        description: 'Run Playwright E2E suite in each pre-PR convergence round'
        required: false
        default: 'true'
        type: string
      requester:
        description: 'GitHub username of the engineer who triggered this run'
        required: false
        default: 'LowSugarCoke'
        type: string
      extra_prompt:
        description: 'Optional extra implementation instructions'
        required: false
        default: ''
        type: string

concurrency:
  group: cloud-implement-ticket-${{ inputs.ticket_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GEMINI_MODEL: gemini-4-carbon
  GEMINI_CLI_TRUST_WORKSPACE: 'true'
  WORKER_CALLBACK_URL: 'https://x-talent-discord-mention-notify.x-talent.workers.dev/__cloud-callback'

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: 'Cloud AI Implement #${{ inputs.ticket_number }}'
    steps:
      - name: Validate inputs and notify Discord Worker (implement_started)
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          TICKET_NUMBER: ${{ inputs.ticket_number }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          MAX_REVIEW_ROUNDS: ${{ inputs.max_review_rounds }}
          RUN_E2E: ${{ inputs.run_e2e }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLEAN_TICKET="${TICKET_NUMBER//#/}"
          CLEAN_TICKET="${CLEAN_TICKET//[[:space:]]/}"
          if ! [[ "$CLEAN_TICKET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ticket_number '${TICKET_NUMBER}'. Must be a positive integer."
            exit 1
          fi
          echo "SAFE_TICKET_NUMBER=${CLEAN_TICKET}" >> "$GITHUB_ENV"

          CLEAN_BRANCH="${BRANCH_NAME//[[:space:]]/}"
          if [ -n "$CLEAN_BRANCH" ]; then
            if ! [[ "$CLEAN_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$CLEAN_BRANCH" == *".."* ]] || [[ "$CLEAN_BRANCH" == -* ]] || [[ "$CLEAN_BRANCH" == /* ]]; then
              echo "::error::Invalid branch_name '${BRANCH_NAME}'."
              exit 1
            fi
          fi
          echo "SAFE_BRANCH_NAME=${CLEAN_BRANCH}" >> "$GITHUB_ENV"

          CLEAN_ROUNDS="${MAX_REVIEW_ROUNDS//[[:space:]]/}"
          if ! [[ "$CLEAN_ROUNDS" =~ ^[0-9]+$ ]] || [ "$CLEAN_ROUNDS" -lt 1 ]; then
            CLEAN_ROUNDS="3"
          elif [ "$CLEAN_ROUNDS" -gt 10 ]; then
            CLEAN_ROUNDS="10"
          fi
          echo "SAFE_MAX_ROUNDS=${CLEAN_ROUNDS}" >> "$GITHUB_ENV"

          CLEAN_E2E="${RUN_E2E//[[:space:]]/}"
          if [ "$CLEAN_E2E" = "false" ] || [ "$CLEAN_E2E" = "0" ]; then
            echo "SAFE_RUN_E2E=false" >> "$GITHUB_ENV"
          else
            echo "SAFE_RUN_E2E=true" >> "$GITHUB_ENV"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "implement_started" \
              --arg runUrl "$RUN_URL" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with PNPM cache (Suggestion 6)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Pre-flight Ticket Scope Gate (skip pure backend / non-frontend tickets)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          BRANCH_NAME: ${{ env.SAFE_BRANCH_NAME }}
        run: |
          mkdir -p .agents/tmp
          rm -f .agents/tmp/ticket-scope.json .agents/tmp/scope-guidance.md
          GH_TOKEN="${TRACKER_READ_TOKEN:-$GH_TOKEN}" node scripts/export-ticket-spec.mjs --ticket="$TICKET_NUMBER" --repo="Xchange-Taiwan/X-Talent-Tracker" --out=.agents/tmp/ticket-spec.md 2>/dev/null || true
          node scripts/check-ticket-scope.mjs \
            --spec-file=.agents/tmp/ticket-spec.md \
            --branch="$BRANCH_NAME" \
            --out=.agents/tmp/ticket-scope.json \
            --guidance-out=.agents/tmp/scope-guidance.md || true

          ACTIONABLE=$(jq -r 'if .actionableInFrontendRepo == false then "false" else "true" end' .agents/tmp/ticket-scope.json 2>/dev/null || echo "true")
          SCOPE_REASON=$(jq -r '.reason // ""' .agents/tmp/ticket-scope.json 2>/dev/null | tr '\r\n' ' ' || echo "")

          if [ "$ACTIONABLE" = "false" ]; then
            echo "SCOPE_SKIPPED=true" >> "$GITHUB_ENV"
            EOF_MARKER="EOF_$(openssl rand -hex 16)"
            {
              echo "SCOPE_SKIP_REASON<<${EOF_MARKER}"
              echo "$SCOPE_REASON"
              echo "${EOF_MARKER}"
            } >> "$GITHUB_ENV"
            echo "::notice::Skipping frontend Cloud AI VM for #${TICKET_NUMBER}: ${SCOPE_REASON}"
          else
            echo "SCOPE_SKIPPED=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.SCOPE_SKIPPED != 'true'
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (Suggestion 6)
        if: env.SCOPE_SKIPPED != 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: env.SCOPE_SKIPPED != 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm playwright install chromium

      - name: Install Noto CJK fonts for crisp Traditional Chinese rendering
        if: env.SCOPE_SKIPPED != 'true'
        continue-on-error: true
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf" -o ~/.local/share/fonts/NotoSansTC.ttf || true
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf" -o ~/.local/share/fonts/NotoSansCJKtc-Regular.otf || true
          fc-cache -f ~/.local/share/fonts || true

      - name: Prepare linked feature branch and configure local environment
        if: env.SCOPE_SKIPPED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          BRANCH_NAME: ${{ env.SAFE_BRANCH_NAME }}
          BFF_OPENAPI_URL: ${{ secrets.BFF_OPENAPI_URL || vars.BFF_OPENAPI_URL }}
          DESIGN_AUDIT_MENTOR_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTOR_EMAIL || secrets.E2E_MENTOR_EMAIL }}
          DESIGN_AUDIT_MENTOR_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTOR_PASSWORD || secrets.E2E_MENTOR_PASSWORD }}
          DESIGN_AUDIT_MENTEE_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTEE_EMAIL || secrets.E2E_MENTEE_EMAIL }}
          DESIGN_AUDIT_MENTEE_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTEE_PASSWORD || secrets.E2E_MENTEE_PASSWORD }}
          E2E_MENTOR_EMAIL: ${{ secrets.E2E_MENTOR_EMAIL || secrets.DESIGN_AUDIT_MENTOR_EMAIL }}
          E2E_MENTOR_PASSWORD: ${{ secrets.E2E_MENTOR_PASSWORD || secrets.DESIGN_AUDIT_MENTOR_PASSWORD }}
          E2E_MENTEE_EMAIL: ${{ secrets.E2E_MENTEE_EMAIL || secrets.DESIGN_AUDIT_MENTEE_EMAIL }}
          E2E_MENTEE_PASSWORD: ${{ secrets.E2E_MENTEE_PASSWORD || secrets.DESIGN_AUDIT_MENTEE_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$BRANCH_NAME" ]; then
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME" || git checkout -b "$BRANCH_NAME" "origin/$BRANCH_NAME"
            bash .agents/scripts/link-ticket-branch.sh "$TICKET_NUMBER" "$BRANCH_NAME"
          else
            bash .agents/scripts/link-ticket-branch.sh "$TICKET_NUMBER"
          fi
          ACTIVE_BR=$(git branch --show-current)
          if [ -z "$ACTIVE_BR" ] || [ "$ACTIVE_BR" = "develop" ] || [ "$ACTIVE_BR" = "main" ]; then
            echo "::error::Failed to create or switch to a dedicated ticket branch (currently on '${ACTIVE_BR}')."
            exit 1
          fi
          bash .agents/scripts/setup-cloud-env.sh

      - name: Run Gemini CLI to implement or complete ticket requirements (Phase 1)
        if: env.SCOPE_SKIPPED != 'true'
        id: gemini_implement
        timeout-minutes: 18
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          BRANCH_NAME: ${{ env.SAFE_BRANCH_NAME }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        run: |
          mkdir -p .agents/tmp
          if [ ! -s .agents/tmp/ticket-spec.md ]; then
            GH_TOKEN="${TRACKER_READ_TOKEN:-$GH_TOKEN}" node scripts/export-ticket-spec.mjs --ticket="$TICKET_NUMBER" --repo="Xchange-Taiwan/X-Talent-Tracker" --out=.agents/tmp/ticket-spec.md 2>/dev/null || true
          fi
          ARCH_QUERY="#${TICKET_NUMBER} $(head -n 25 .agents/tmp/ticket-spec.md 2>/dev/null | tr '\n' ' ' || echo '')"
          jq -n --arg q "$ARCH_QUERY" '{query: $q}' | curl -sS -X POST "https://x-talent-discord-mention-notify.x-talent.workers.dev/__arch-kb" -H "Content-Type: application/json" -d @- | jq -r 'if .kb then "\n\n## X-Talent 跨專案架構知識庫 (Cloudflare KV Architecture KB)\n```json\n" + (.kb | tojson) + "\n```" else "" end' >> .agents/tmp/ticket-spec.md 2>/dev/null || true
          node scripts/prefetch-ticket-visuals.mjs --ticket="$TICKET_NUMBER" || true
          SCOPE_GUIDANCE=""
          if [ -s .agents/tmp/scope-guidance.md ]; then
            SCOPE_GUIDANCE=$(cat .agents/tmp/scope-guidance.md)
          fi

          PROMPT_FILE=$(mktemp)
          if [ -n "$BRANCH_NAME" ]; then
            printf '我們正在處理從本地 Promote 上雲端的分支 %s，對應 https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/%s（完整 Issue 規格、留言與視覺清單已預先下載至 .agents/tmp/ticket-spec.md）。\n' "$BRANCH_NAME" "$TICKET_NUMBER" > "$PROMPT_FILE"
            cat <<'EOF' >> "$PROMPT_FILE"
          請依序執行：
          1. 直接讀取 .agents/tmp/ticket-spec.md；若規格末段列有預先下載至 .agents/tmp/ticket-images/ 的附圖或 Design Hub 原型截圖與 -dom.md 樣式摘要，請務必先用 read_file 逐一檢視圖片細節與 CSS 數值，並對照 git diff origin/develop 與所有驗收條件（Acceptance Criteria）。
          2. 補齊尚未實作完畢的需求、Vitest 單元測試、Playwright E2E (.spec.ts) 與對應的 Storybook (.stories.tsx) 檔案（嚴禁手動修改自動產生的 src/types/api.ts；嚴禁修改 .storybook/storiesCoverage.test.tsx，該測試已改為自動掃描全站 .stories.tsx）。
          3. 互動式 UI 證據截圖要求：只要本次變更涉及前端畫面或 UI 元件（src/app/** 或 src/components/**），請務必在對應的 Playwright E2E (.spec.ts) 中引入 captureEvidence，並在實際互動打開目標狀態且 expect(...).toBeVisible() 通過後呼叫 await captureEvidence(page, '<描述性狀態名稱>')。
          4. 極速批次開發規範：一次規劃並批次寫完所有元件、Storybook、單元測試與 E2E 檔案後請立即結束回覆（Phase 2 漏斗快篩會自動平行執行 lint、type-check、單元測試與 Turbopack E2E 截圖驗證）。
          EOF
          else
            printf '請針對 https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/%s 執行第一階段程式碼與測試實作：\n1. Issue #%s 的完整規格、留言與視覺參考圖清單已預先下載至 .agents/tmp/ticket-spec.md，請直接讀取 .agents/tmp/ticket-spec.md。\n' "$TICKET_NUMBER" "$TICKET_NUMBER" > "$PROMPT_FILE"
            cat <<'EOF' >> "$PROMPT_FILE"
          若列有 .agents/tmp/ticket-images/ 下的設計參考圖或 Design Hub 原型截圖與 -dom.md 樣式摘要，動手寫 UI 前請務必先用 read_file 逐一檢視圖片，確保排版、字級與狀態 1:1 對齊。
          2. 根據需求完成程式碼、Vitest 單元測試、Playwright E2E (.spec.ts) 與 Storybook (.stories.tsx) 檔案（嚴禁手動修改自動產生的 src/types/api.ts；嚴禁修改 .storybook/storiesCoverage.test.tsx，該測試已改為自動掃描全站 .stories.tsx）。
          3. 互動式 UI 證據截圖要求：只要涉及前端畫面或 UI 元件（src/app/** 或 src/components/**），請在 Playwright E2E (.spec.ts) 中引入 captureEvidence，並在實際互動打開目標狀態且 expect(...).toBeVisible() 通過後呼叫 await captureEvidence(page, '<描述性狀態名稱>')。
          4. 極速批次開發規範：一次規劃並批次寫完所有元件、Storybook、單元測試與 E2E 檔案後請立即結束回覆（Phase 2 漏斗快篩會自動平行執行 lint、type-check、單元測試與 Turbopack E2E 截圖驗證）。
          EOF
          fi
          printf '\n%s\n%s\n' "$SCOPE_GUIDANCE" "$EXTRA_PROMPT" >> "$PROMPT_FILE"
          npx gemini -m "$GEMINI_MODEL" --approval-mode=yolo --skip-trust -p "$(cat "$PROMPT_FILE")"
          rm -f "$PROMPT_FILE"

      - name: Run Fast Funnel Deterministic & Playwright E2E Verification Loop (Phase 2)
        if: env.SCOPE_SKIPPED != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          MAX_AI_REVIEW_ROUNDS: ${{ env.SAFE_MAX_ROUNDS }}
          RUN_E2E: ${{ env.SAFE_RUN_E2E }}
          CONVERGE_MAX_DURATION_MS: '1800000'
        run: |
          node scripts/cloud-converge-loop.mjs \
            --ticket="$TICKET_NUMBER" \
            --max-rounds="$MAX_AI_REVIEW_ROUNDS" \
            --run-e2e="$RUN_E2E" \
            --run-ai-review=false \
            --require-ui-evidence="$RUN_E2E"

      - name: Submit Pull Request and sync Project Board (Phase 3)
        if: env.SCOPE_SKIPPED != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRACKER_READ_TOKEN: ${{ secrets.TRACKER_READ_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
        run: bash .agents/scripts/cloud-submit-pr.sh implement

      - name: Finalize and notify Discord Worker (Suggestion 4 auto-recovery & Vercel limit detection)
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER || inputs.ticket_number }}
          JOB_STATUS: ${{ job.status }}
          SCOPE_SKIPPED: ${{ env.SCOPE_SKIPPED }}
          SCOPE_SKIP_REASON: ${{ env.SCOPE_SKIP_REASON }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env.development.local .env.e2e.local
          CLEAN_TICKET=$(printf '%s' "$TICKET_NUMBER" | tr -cd '0-9')

          PR_JSON=""
          CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
          if [ -n "$CURRENT_BRANCH" ] && [ "$CURRENT_BRANCH" != "develop" ] && [ "$CURRENT_BRANCH" != "main" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --head "$CURRENT_BRANCH" --state open --json number,url --jq '.[0] // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$PR_JSON" ] && [ -n "$CLEAN_TICKET" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --state open --limit 30 --json number,url,headRefName,title,body 2>/dev/null | jq -c --arg t "$CLEAN_TICKET" '
              map(select(
                (.headRefName | test("(^|/|-)" + $t + "(-|$)")) or
                (.title | test("#" + $t + "(\\b|$)")) or
                (.body // "" | test("(X-Talent-Tracker/issues/|#)" + $t + "(\\b|$)"))
              )) | .[0] // empty
            ' 2>/dev/null || echo "")
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || echo "")
          PR_URL=$(echo "$PR_JSON" | jq -r '.url // empty' 2>/dev/null || echo "")

          VERCEL_LIMIT="false"
          if [ -n "$PR_NUMBER" ]; then
            if gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[].body' 2>/dev/null | grep -qiE 'vercel-quota-limit|api-deployments-free-per-day'; then
              VERCEL_LIMIT="true"
            fi
          fi

          if [ "$SCOPE_SKIPPED" = "true" ]; then
            STATUS="implement_failed"
            MSG="前端虛擬機預檢略過：${SCOPE_SKIP_REASON:-此票無獨立前端實作項目}"
          elif [ -n "$PR_NUMBER" ] && [ "$JOB_STATUS" = "success" ]; then
            STATUS="implement_succeeded"
            MSG="雲端 AI 已完成測試與截圖驗證並開出草稿 PR #${PR_NUMBER}（等待線上 AI Review 審查）"
          else
            STATUS="implement_failed"
            MSG="雲端實作未完成（狀態: ${JOB_STATUS}），按鈕已自動解鎖可重試"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "$STATUS" \
              --arg prNumber "${PR_NUMBER:-0}" \
              --arg prUrl "$PR_URL" \
              --arg message "$MSG" \
              --arg runUrl "$RUN_URL" \
              --argjson vercelLimitReached "$VERCEL_LIMIT" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                prNumber: (if ($prNumber | tonumber? // 0) > 0 then ($prNumber | tonumber) else null end),
                prUrl: (if $prUrl != "" then $prUrl else null end),
                message: $message,
                vercelLimitReached: $vercelLimitReached,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi
