name: Cloud AI Implement Ticket

on:
  workflow_dispatch:
    inputs:
      ticket_number:
        description: 'X-Talent-Tracker Issue Number (e.g. 780)'
        required: true
        type: string
      requester:
        description: 'GitHub username of the engineer who triggered this run'
        required: false
        default: 'LowSugarCoke'
        type: string
      extra_prompt:
        description: 'Optional extra implementation instructions'
        required: false
        default: ''
        type: string

concurrency:
  group: cloud-implement-ticket-${{ inputs.ticket_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GEMINI_MODEL: gemini-4-argon
  GEMINI_CLI_TRUST_WORKSPACE: 'true'
  WORKER_CALLBACK_URL: 'https://x-talent-discord-mention-notify.eat-what.workers.dev/__cloud-callback'

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: 'Cloud AI Implement #${{ inputs.ticket_number }}'
    steps:
      - name: Validate inputs and notify Discord Worker (implement_started)
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          TICKET_NUMBER: ${{ inputs.ticket_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CLEAN_TICKET="${TICKET_NUMBER//#/}"
          CLEAN_TICKET="${CLEAN_TICKET//[[:space:]]/}"
          if ! [[ "$CLEAN_TICKET" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid ticket_number '${TICKET_NUMBER}'. Must be a positive integer."
            exit 1
          fi
          echo "SAFE_TICKET_NUMBER=${CLEAN_TICKET}" >> "$GITHUB_ENV"

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "implement_started" \
              --arg runUrl "$RUN_URL" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up PNPM
        uses: pnpm/action-setup@v6

      - name: Set up Node.js with PNPM cache (Suggestion 6)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers (Suggestion 6)
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm playwright install-deps chromium
          else
            pnpm playwright install --with-deps chromium
          fi

      - name: Configure Git and local environment for UI evidence capture
        env:
          DESIGN_AUDIT_MENTOR_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTOR_EMAIL || secrets.E2E_MENTOR_EMAIL }}
          DESIGN_AUDIT_MENTOR_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTOR_PASSWORD || secrets.E2E_MENTOR_PASSWORD }}
          DESIGN_AUDIT_MENTEE_EMAIL: ${{ secrets.DESIGN_AUDIT_MENTEE_EMAIL || secrets.E2E_MENTEE_EMAIL }}
          DESIGN_AUDIT_MENTEE_PASSWORD: ${{ secrets.DESIGN_AUDIT_MENTEE_PASSWORD || secrets.E2E_MENTEE_PASSWORD }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_DEV }}
        run: |
          git config user.name "x-talent-cloud-agent[bot]"
          git config user.email "x-talent-cloud-agent[bot]@users.noreply.github.com"
          {
            printf '%s=%s\n' "NEXTAUTH_URL" "http://localhost:3000"
            printf '%s=%s\n' "NEXTAUTH_SECRET" "$NEXTAUTH_SECRET"
            printf '%s=%s\n' "DESIGN_AUDIT_MENTOR_EMAIL" "$DESIGN_AUDIT_MENTOR_EMAIL"
            printf '%s=%s\n' "DESIGN_AUDIT_MENTOR_PASSWORD" "$DESIGN_AUDIT_MENTOR_PASSWORD"
            printf '%s=%s\n' "DESIGN_AUDIT_MENTEE_EMAIL" "$DESIGN_AUDIT_MENTEE_EMAIL"
            printf '%s=%s\n' "DESIGN_AUDIT_MENTEE_PASSWORD" "$DESIGN_AUDIT_MENTEE_PASSWORD"
          } > .env.development.local
          chmod 600 .env.development.local

          mkdir -p .git/info .git/hooks
          printf '\n.env.development.local\n.env*.local\n' >> .git/info/exclude
          cat <<'HOOK' > .git/hooks/pre-commit
          #!/usr/bin/env bash
          if git diff --cached --name-only | grep -qE '(^|/)\.env(\..+)?$'; then
            git reset HEAD -- '.env*' '*/.env*' >/dev/null 2>&1 || true
            echo "Blocked staging of .env files in pre-commit hook." >&2
            exit 1
          fi
          HOOK
          chmod +x .git/hooks/pre-commit

      - name: Run Gemini CLI to implement ticket and open PR
        id: gemini_implement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER }}
          EXTRA_PROMPT: ${{ inputs.extra_prompt }}
        run: |
          trap 'rm -f .env.development.local' EXIT
          PROMPT="請讀取並嚴格遵循 .agents/skills/implement/SKILL.md 的流程，針對 https://github.com/Xchange-Taiwan/X-Talent-Tracker/issues/${TICKET_NUMBER} 執行完整實作：
          1. 執行 bash .agents/scripts/link-ticket-branch.sh ${TICKET_NUMBER} 建立並綁定 Linked Branch，確認看板移至 In progress。
          2. 根據 Issue #${TICKET_NUMBER} 需求完成程式碼實作，並執行 pnpm type-check 與 pnpm test 確保通過。
          3. 若涉及 UI 變更，請於背景啟動 pnpm dev 並執行 node scripts/capture-ui-evidence.mjs 擷取畫面截圖存入 .agents/tmp/evidence/。
          4. 執行 .agents/skills/submit-pr/SKILL.md 流程：發佈截圖至 pr-evidence 分支、commit 並 push 分支、使用 gh pr create 開立指向 develop 的 Pull Request，並將 Project #7 看板狀態更新為 PR Review。
          ${EXTRA_PROMPT}"
          npx gemini -m "$GEMINI_MODEL" --approval-mode=yolo --skip-trust -p "$PROMPT"

      - name: Finalize and notify Discord Worker (Suggestion 4 auto-recovery & Vercel limit detection)
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CLOUD_CALLBACK_SECRET || secrets.GITHUB_WEBHOOK_SECRET || secrets.TRACKER_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.TRACKER_READ_TOKEN || secrets.GITHUB_TOKEN }}
          TICKET_NUMBER: ${{ env.SAFE_TICKET_NUMBER || inputs.ticket_number }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env.development.local
          CLEAN_TICKET=$(printf '%s' "$TICKET_NUMBER" | tr -cd '0-9')

          PR_JSON=""
          CURRENT_BRANCH=$(git branch --show-current 2>/dev/null || echo "")
          if [ -n "$CURRENT_BRANCH" ] && [ "$CURRENT_BRANCH" != "develop" ] && [ "$CURRENT_BRANCH" != "main" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --head "$CURRENT_BRANCH" --state open --json number,url --jq '.[0] // empty' 2>/dev/null || echo "")
          fi
          if [ -z "$PR_JSON" ] && [ -n "$CLEAN_TICKET" ]; then
            PR_JSON=$(gh pr list --repo "${{ github.repository }}" --state open --limit 30 --json number,url,headRefName,title,body 2>/dev/null | jq -c --arg t "$CLEAN_TICKET" '
              map(select(
                (.headRefName | test("(^|/|-)" + $t + "(-|$)")) or
                (.title | test("#" + $t + "(\\b|$)")) or
                (.body // "" | test("(X-Talent-Tracker/issues/|#)" + $t + "(\\b|$)"))
              )) | .[0] // empty
            ' 2>/dev/null || echo "")
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || echo "")
          PR_URL=$(echo "$PR_JSON" | jq -r '.url // empty' 2>/dev/null || echo "")

          VERCEL_LIMIT="false"
          if [ -n "$PR_NUMBER" ]; then
            CHECKS_TEXT=$(gh pr checks "$PR_NUMBER" --repo "${{ github.repository }}" 2>&1 || true)
            if echo "$CHECKS_TEXT" | grep -qiE "Vercel.*fail|api-deployments-free-per-day|Resource is limited"; then
              VERCEL_LIMIT="true"
            fi
          fi

          if [ -n "$PR_NUMBER" ] && [ "$JOB_STATUS" = "success" ]; then
            STATUS="implement_succeeded"
            MSG="雲端 AI 已完成實作並開出 PR #${PR_NUMBER}"
          elif [ -n "$PR_NUMBER" ]; then
            STATUS="implement_succeeded"
            MSG="PR #${PR_NUMBER} 已開出（部分後續步驟需確認）"
          else
            STATUS="implement_failed"
            MSG="雲端實作未成功開出 PR（狀態: ${JOB_STATUS}），按鈕已自動解鎖可重試"
          fi

          if [ -n "$CALLBACK_SECRET" ]; then
            jq -n \
              --arg issueNumber "$CLEAN_TICKET" \
              --arg status "$STATUS" \
              --arg prNumber "${PR_NUMBER:-0}" \
              --arg prUrl "$PR_URL" \
              --arg message "$MSG" \
              --arg runUrl "$RUN_URL" \
              --argjson vercelLimitReached "$VERCEL_LIMIT" \
              '{
                issueNumber: ($issueNumber | tonumber? // null),
                status: $status,
                prNumber: (if ($prNumber | tonumber? // 0) > 0 then ($prNumber | tonumber) else null end),
                prUrl: (if $prUrl != "" then $prUrl else null end),
                message: $message,
                vercelLimitReached: $vercelLimitReached,
                runUrl: $runUrl
              }' | curl -sS -X POST "$WORKER_CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CALLBACK_SECRET" \
                -d @- || true
          fi
